    rel="stylesheet" />
  <title>ASPK4Hapur — People First. Nation First.</title>

  <!-- Google Translate & Phonetic Hindi Transliteration -->
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement(
        {
          pageLanguage: 'en',
          includedLanguages: 'hi,en',
          autoDisplay: false,
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
        },
        'google_translate_element'
      );

      // Transliteration Map: English & Literal Hindi -> Phonetic Devanagari (Hinglish in Hindi Script)
      const transliterations = [
        // Proper Nouns & Location Spelling Correction
        { pattern: /\b(Hapur|hapur|HAPUR|हापुर)\b/g, replace: 'हापुड़' },

        // Navigation & Key Terms
        { pattern: /\b(Home|home|घर|गृह)\b/g, replace: 'होम' },
        { pattern: /\b(About|about|हमारे बारे में|के बारे में|बारे में)\b/g, replace: 'अबाउट' },
        { pattern: /\b(Manifesto|manifesto|घोषणापत्र|घोषणा पत्र)\b/g, replace: 'मैनिफेस्टो' },
        { pattern: /\b(Members|members|सदस्य|सदस्यों)\b/g, replace: 'मेंबर्स' },
        { pattern: /\b(Gallery|gallery|चित्रदीर्घा)\b/g, replace: 'गैलरी' },
        { pattern: /\b(News|news|समाचार|खबरें|ख़बरें)\b/g, replace: 'न्यूज़' },
        { pattern: /\b(Events|events|कार्यक्रम|घटनाएँ|घटनाएं)\b/g, replace: 'इवेंट्स' },
        { pattern: /\b(Citizens|citizens|नागरिक|नागरिकों)\b/g, replace: 'सिटीज़न्स' },
        { pattern: /\b(Join Us|join us|जॉइन अस)\b/gi, replace: 'जॉइन अस' },
        { pattern: /\b(Join the Party|join the party)\b/gi, replace: 'जॉइन द पार्टी' },
        { pattern: /\b(Join|join|शामिल हों|जुड़ें|शामिल होना)\b/g, replace: 'जॉइन' },
        { pattern: /\b(Donate Now|donate now)\b/gi, replace: 'डोनेट नाओ' },
        { pattern: /\b(Donate|donate|दान करें|दान)\b/g, replace: 'डोनेट' },
        { pattern: /\b(Contact Us|contact us|संपर्क करें)\b/gi, replace: 'कांटेक्ट अस' },
        { pattern: /\b(Contact|contact|संपर्क)\b/g, replace: 'कांटेक्ट' },
        { pattern: /\b(Complaints|complaints|शिकायतें)\b/g, replace: 'कंप्लेंट्स' },
        { pattern: /\b(Complaint|complaint|शिकायत)\b/g, replace: 'कंप्लेंट' },
        { pattern: /\b(FAQ|faq|सामान्य प्रश्न|प्रश्नोत्तरी)\b/g, replace: 'एफएक्यू' },
        { pattern: /\b(Volunteer|volunteer|स्वयंसेवक)\b/g, replace: 'वोलंटियर' },
        { pattern: /\b(Sign in|sign in|प्रवेश करें)\b/gi, replace: 'साइन इन' },
        { pattern: /\b(Sign out|sign out|बाहर निकलें)\b/gi, replace: 'साइन आउट' },
        { pattern: /\b(Login|login|लॉग इन|लॉगिन)\b/gi, replace: 'लॉगिन' },
        { pattern: /\b(Logout|logout|लॉग आउट|लॉगआउट)\b/gi, replace: 'लॉगआउट' },
        { pattern: /\b(Admin Panel|admin panel)\b/gi, replace: 'एडमिन पैनल' },
        { pattern: /\b(Admin|admin|व्यवस्थापक|प्रशासक)\b/g, replace: 'एडमिन' },
        { pattern: /\b(Latest News|latest news|नवीनतम समाचार|ताज़ा समाचार)\b/gi, replace: 'लेटेस्ट न्यूज़' },
        { pattern: /\b(Upcoming Events|upcoming events|आगामी कार्यक्रम)\b/gi, replace: 'अपकमिंग इवेंट्स' },
        { pattern: /\b(Party|party|दल)\b/g, replace: 'पार्टी' },
        { pattern: /\b(Official|official|आधिकारिक)\b/gi, replace: 'ऑफिशियल' },
        { pattern: /\b(Movement|movement|आंदोलन)\b/gi, replace: 'मूवमेंट' },
        { pattern: /\b(Governance|governance|शासन)\b/gi, replace: 'गवर्नेंस' },
        { pattern: /\b(Community|community|समुदाय)\b/gi, replace: 'कम्युनिटी' },
        { pattern: /\b(Service|service|सेवा)\b/gi, replace: 'सर्विस' },
        { pattern: /\b(Representation|representation|प्रतिनिधित्व)\b/gi, replace: 'रिप्रेजेंटेशन' },
        { pattern: /\b(View all|view all|सभी देखें)\b/gi, replace: 'व्यू ऑल' },
        { pattern: /\b(Scroll|scroll)\b/gi, replace: 'स्क्रॉल' }
      ];

      function isHindiActive() {
        const cookies = document.cookie;
        const htmlLang = document.documentElement.lang;
        const htmlClass = document.documentElement.className;
        return (
          cookies.includes('googtrans=/en/hi') ||
          cookies.includes('googtrans=%2Fen%2Fhi') ||
          htmlLang === 'hi' ||
          htmlClass.includes('translated-ltr')
        );
      }

      function applyPhoneticTransliteration() {
        if (!isHindiActive()) return;

        const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null);
        let node;
        while ((node = walker.nextNode())) {
          const parent = node.parentElement;
          if (!parent) continue;
          const tagName = parent.tagName;
          if (tagName === 'SCRIPT' || tagName === 'STYLE' || parent.classList.contains('goog-te-combo')) {
            continue;
          }

          let val = node.nodeValue;
          if (!val || !val.trim()) continue;

          let newVal = val;
          for (let i = 0; i < transliterations.length; i++) {
            const item = transliterations[i];
            newVal = newVal.replace(item.pattern, item.replace);
          }

          if (newVal !== val) {
            node.nodeValue = newVal;
          }
        }
      }

      const observer = new MutationObserver(function() {
        applyPhoneticTransliteration();
      });

      observer.observe(document.body, { childList: true, subtree: true, characterData: true });
      setInterval(applyPhoneticTransliteration, 300);
    }
  </script>
  <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  <style>
    /* Hide default Google Translate toolbar banner */
    .goog-te-banner-frame,
    #goog-gt-tt,
    .goog-te-balloon-frame {

    }

    body {
      top: 0 !important;
    }

    .goog-te-menu-value:hover {
      text-decoration: none !important;
    }

    .goog-logo-link {
      display: none !important;
    }

    .goog-te-gadget {
      color: transparent !important;
      font-size: 0 !important;
    }

    .goog-te-gadget .goog-te-combo {
      color: #000 !important;
      font-size: 14px !important;
    }

    /* Hide the top bar Google Translate adds to the page */
    .skiptranslate:not(#google_translate_element) {
      display: none !important;
    }

    #google_translate_element {
      position: absolute;
      left: -9999px;
      top: -9999px;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }
  </style>
</head>

  <div id="google_translate_element"></div>

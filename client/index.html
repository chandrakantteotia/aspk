    <!-- Google Translate -->
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement(
          {
            pageLanguage: 'en',
            includedLanguages: 'hi,en',
            autoDisplay: false,
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
          },
          'google_translate_element'
        );
      }
    </script>
    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <style>
      /* Hide default Google Translate toolbar banner */
      .goog-te-banner-frame, #goog-gt-tt, .goog-te-balloon-frame { display: none !important; }
      body { top: 0 !important; }
      .goog-te-menu-value:hover { text-decoration: none !important; }
      .goog-logo-link { display: none !important; }
      .goog-te-gadget { color: transparent !important; font-size: 0 !important; }
      .goog-te-gadget .goog-te-combo { color: #000 !important; font-size: 14px !important; }
      /* Hide the top bar Google Translate adds to the page */
      .skiptranslate { display: none !important; }
      body { top: 0px !important; }
    </style>
  </head>
  <body>
    <!-- Hidden Google Translate widget target -->
    <div id="google_translate_element" style="display:none;"></div>
